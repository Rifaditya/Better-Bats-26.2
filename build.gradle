plugins {
    id 'fabric-loom' version '1.10.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://maven.isxander.dev/snapshots" }
    maven { url = "https://api.modrinth.com/maven" }
    flatDir {
        dirs 'e:/Minecraft Project/Dasik Library v1.20.1/Archive Jar of all versions/MC 1.20.1'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "net.dasik.social:dasik-library:1.1.0+1.20.1"

    modCompileOnly "com.terraformersmc:modmenu:7.2.2"
    modCompileOnly("dev.isxander.yacl:yet-another-config-lib-fabric:3.2.1+1.20") {
        transitive = false
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.fabric_loader_version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": project.fabric_loader_version,
               "minecraft_version": project.minecraft_version
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveBaseName = project.archives_base_name
    from("LICENSE") {
        rename "LICENSE_${project.archives_base_name}", "LICENSE"
    }
}

remapJar {
    archiveBaseName = project.archives_base_name
}

afterEvaluate {
    tasks.register('archiveReleaseJar', Copy) {
        dependsOn build
        def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
        from targetJarTask.archiveFile
        into file("../Archive Jar of all versions/MC 1.20.1")
        doLast {
            def jarFile = targetJarTask.archiveFile.get().asFile
            println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to local Archive directory: ${destinationDir.absolutePath}"

            // 1. Modrinth Profile Auto-Deploy
            def profileModsDir = file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 1.20.1/mods")
            if (profileModsDir.exists()) {
                profileModsDir.listFiles().each { f ->
                    if (f.name.startsWith("${project.archives_base_name}-") && f.name.endsWith(".jar") && !f.name.equals(jarFile.name)) {
                        println "[AUTO-DEPLOY] Purging stale version: ${f.name}"
                        f.delete()
                    }
                }
                copy {
                    from jarFile
                    into profileModsDir
                }
                println "[AUTO-DEPLOY] Successfully deployed ${jarFile.name} to Modrinth profile: ${profileModsDir.absolutePath}"
            }

            // 2. Central Release Hub Archives Sync
            File hubDir = file("E:/Minecraft Project/minecraft-mod-release-hub/archives/Better Bats")
            if (!hubDir.exists()) {
                hubDir.mkdirs()
            }
            copy {
                from jarFile
                into hubDir
            }
            println "[HUB-ARCHIVE] Successfully copied ${jarFile.name} to release hub archives: ${hubDir.absolutePath}"

            // 3. External Vault Archive Sync
            File vaultDir = file("D:/Minecraft Mod Archive Jars/Better Bats")
            if (!vaultDir.exists()) {
                vaultDir.mkdirs()
            }
            copy {
                from jarFile
                into vaultDir
            }
            println "[VAULT-ARCHIVE] Successfully copied ${jarFile.name} to external vault: ${vaultDir.absolutePath}"
        }
    }
    build.finalizedBy archiveReleaseJar
}
